name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-docs:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native agent
        shell: pwsh
        run: ./scripts/build-native-agent.ps1 -Configuration Release

      - name: Restore
        run: dotnet restore TalosForge.sln

      - name: Build
        run: dotnet build TalosForge.sln --configuration Release --no-restore

      - name: Test (Deterministic)
        run: >
          dotnet test TalosForge.sln
          --configuration Release
          --no-build
          --filter "Suite!=LiveSmoke"
          --results-directory TestResults
          --logger "trx;LogFileName=deterministic.trx"
          --logger "console;verbosity=normal"

      - name: Test (Live Smoke)
        run: >
          dotnet test TalosForge.sln
          --configuration Release
          --no-build
          --filter "Suite=LiveSmoke"
          --results-directory TestResults
          --logger "trx;LogFileName=live-smoke.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Verify docs
        shell: pwsh
        run: ./scripts/verify-docs.ps1
